[project]
name = "keyhold"
version = "0.1.0"
description = "Lend a server's web console keyboard to an AI agent, locked behind a PayPal authorization hold."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ted Chen" }]
dependencies = [
    "anthropic",
    "paypal-server-sdk",
    "fastapi",
    "uvicorn",
    "jinja2",
    "httpx",
    "pillow",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keyhold", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running property or chaos tests",
]
